apiVersion: batch/v1
kind: Job
metadata:
  name: order-producer
spec:
  template:
    spec:
      containers:
        - name: order-producer
          image: devsecops-lab/k8s-app:1.0
          imagePullPolicy: IfNotPresent
          command: ["node", "kafka-producer.js"]
      restartPolicy: Never
  backoffLimit: 2
